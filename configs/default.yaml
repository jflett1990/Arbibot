mode: paper
live_trading_enabled: false
symbol: BTCUSDT
market:
  no_trade_final_seconds: 15
  require_market_metadata: true
risk:
  risk_per_trade_pct: 0.005
  daily_loss_cap_pct: 0.02
  hard_stop_pct: 0.004
  max_market_exposure_pct: 0.02
  max_open_orders: 1
  max_daily_traded_notional_pct: 0.20
edge:
  min_net_edge: 0.015
  model_error_buffer: 0.005
  spread_penalty_multiplier: 1.0
liquidity:
  max_spread: 0.03
  min_depth_ratio: 3.0
latency:
  max_binance_event_age_ms: 750
  max_polymarket_event_age_ms: 1000
  max_order_ack_p95_ms: 750
storage:
  sqlite_path: data/events.sqlite3
